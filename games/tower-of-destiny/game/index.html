<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tower of Destiny</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; -ms-touch-action: none; touch-action: none; -webkit-user-select: none; user-select: none; }
  /* only when the game is drawn at its plain size: stretch it with crisp pixels instead of blurry smoothing */
  .plain canvas { image-rendering: -moz-crisp-edges !important; image-rendering: crisp-edges !important; image-rendering: pixelated !important; }
</style>
</head>
<body>
<script src="lib/phaser262.min.js"></script>
<script>
// Sharper picture: the game's art is 800x480. Instead of stretching a small picture (blurry), the game is drawn into a canvas
// that is a whole-number multiple bigger (2x or 3x, with crisp nearest-neighbour pixels) and the browser shrinks it smoothly to fit the window.
// On a 1080p screen that is 3x = 2400x1440. Slow or touch devices use 2x. Add ?res=1 (plain), ?res=2, ?res=3 or ?res=4 to the address to choose yourself.
(function () {
  var m = /[?&]res=(\d+(?:\.\d+)?)/.exec(location.search), R;
  if (m) R = Math.max(1, Math.min(4, parseFloat(m[1])));
  else {
    var dpr = window.devicePixelRatio || 1, devH = Math.min(screen.width, screen.height) * dpr;
    var touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    var weak = (navigator.deviceMemory && navigator.deviceMemory < 4) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2);
    var cap = touch || weak ? 2 : 3;
    R = Math.max(1, Math.min(cap, Math.ceil(devH / 480)));
  }
  window.TOD_RES = R;
  if (R === 1) document.documentElement.className = 'plain';
  var Orig = Phaser.Game;
  function Game(first) { if (first && typeof first === 'object') { first.resolution = R; first.antialias = false; } return Orig.apply(this, arguments); }
  Game.prototype = Orig.prototype;
  for (var k in Orig) if (Object.prototype.hasOwnProperty.call(Orig, k)) Game[k] = Orig[k];
  Phaser.Game = Game;
})();
</script>
<script src="game.min.js"></script>
</body>
</html>
