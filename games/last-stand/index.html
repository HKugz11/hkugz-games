<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Stand</title>
<link rel="icon" href="../../assets/logo.svg">
<style>
:root{--cy:#7cecff;--pu:#4a1fc2;--ink:#f4f1ff;--dim:rgba(10,8,24,.62)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0a1a;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
button,select{font:inherit;cursor:pointer}
body.playing,body.playing *{cursor:none}
/* menus */
.screen{position:fixed;inset:0;display:grid;place-items:start center;overflow-y:auto;background:radial-gradient(ellipse at 50% 30%,rgba(60,30,120,.55),rgba(8,4,20,.88));z-index:5;text-align:center;padding:20px}
.screen .box{max-width:760px;width:100%;margin:auto}
h1{font-size:clamp(40px,9vw,92px);margin:0;line-height:.95;letter-spacing:-.02em;font-weight:900;background:linear-gradient(180deg,#fff,#d4f8ff 52%,#7cecff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 var(--pu)) drop-shadow(0 0 26px rgba(66,215,241,.55))}
.sub{font-size:17px;margin:10px 0 14px;opacity:.9}
.grp{margin:12px 0}.grp b{display:block;font-size:12px;letter-spacing:.14em;opacity:.7;margin-bottom:6px}
button{border:0;border-radius:12px;padding:10px 20px;font-weight:800;color:#0b1030;background:linear-gradient(#aef3ff,#4fd8f0);box-shadow:0 4px 0 #1b7f94}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #1b7f94}
button.big{font-size:24px;padding:12px 38px}
button.alt{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
button.on{outline:3px solid #fff}
button:disabled{opacity:.4;cursor:default}
select{padding:9px 12px;border-radius:10px;border:2px solid rgba(255,255,255,.3);background:#1a1540;color:#fff;font-weight:700}
.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;max-width:520px;margin:12px auto;text-align:left;font-size:14px;opacity:.9}
.keys span b{display:inline-block;min-width:54px;color:var(--cy)}
.best{font-size:14px;opacity:.8;margin-top:8px}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
#xh{position:absolute;left:50%;top:50%;width:0;height:0}
#xh i{position:absolute;background:#4dff7a;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
#xh i:nth-child(1){left:-1px;top:-14px;width:2px;height:8px}#xh i:nth-child(2){left:-1px;top:6px;width:2px;height:8px}
#xh i:nth-child(3){left:-14px;top:-1px;width:8px;height:2px}#xh i:nth-child(4){left:6px;top:-1px;width:8px;height:2px}
#hm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .25s;background:
 linear-gradient(45deg,transparent 46%,#fff 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#fff 46% 54%,transparent 54%)}
#hm.on{opacity:1;transition:none}#hm.head{filter:drop-shadow(0 0 4px #ff4747) hue-rotate(160deg)}
#top{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 6px #000}
#wave{font-size:30px;font-weight:900}#left{font-size:15px;opacity:.9}
#money{position:absolute;left:20px;top:16px;font-size:28px;font-weight:900;color:#7dff9a;text-shadow:0 2px 6px #000}
#vit{position:absolute;left:20px;bottom:20px;width:260px}
.bar{height:16px;border-radius:8px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:6px;border:2px solid rgba(255,255,255,.25)}
.bar i{display:block;height:100%;width:100%;background:#4dff7a}#armor i{background:#6ab6ff}
#vit span{font-size:13px;font-weight:700;text-shadow:0 2px 4px #000}
#ammo{position:absolute;right:24px;bottom:18px;text-align:right;text-shadow:0 2px 6px #000}
#ammo b{font-size:44px;font-weight:900}#ammo small{font-size:20px;opacity:.8}#gname{font-size:15px;font-weight:800;color:var(--cy)}#slots{font-size:13px;opacity:.85}
#msg{position:absolute;left:50%;top:26%;transform:translateX(-50%);font-size:46px;font-weight:900;text-shadow:0 4px 0 var(--pu),0 0 24px rgba(66,215,241,.7);opacity:0;transition:opacity .4s;text-align:center;white-space:nowrap}
#msg.on{opacity:1}#msg small{display:block;font-size:20px;font-weight:700}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(255,30,30,.75));opacity:0}
#scope{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 0 28vmin,#000 28.4vmin)}
#scope:before,#scope:after{content:"";position:absolute;background:#000}
#scope:before{left:0;right:0;top:50%;height:2px}#scope:after{top:0;bottom:0;left:50%;width:2px}
/* shop */
#shop .box{max-width:1100px}
#shopTop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
#shopMoney{font-size:28px;font-weight:900;color:#7dff9a}
#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;text-align:left}
.it{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.it h4{font-size:17px}.it .st{font-size:12px;opacity:.75}.it p{font-size:12px;opacity:.85;flex:1}
.it .tag{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--cy)}
.it.own{border-color:#7dff9a}.it button{padding:7px 12px;font-size:14px}
#pause .box,#dead .box{max-width:460px}
</style>
<link rel="stylesheet" href="../../assets/xmas.css?v=5"><script src="../../assets/xmas.js?v=2" data-mode="game"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="scope" class="hide"></div>
<div id="hud" class="hide">
  <div id="vig"></div>
  <div id="xh"><i></i><i></i><i></i><i></i></div><div id="hm"></div>
  <div id="top"><div id="wave">WAVE 1</div><div id="left"></div></div>
  <div id="money">$0</div>
  <div id="vit"><span id="hpT">100</span><div class="bar" id="hp"><i></i></div><div class="bar" id="armor"><i style="width:0"></i></div></div>
  <div id="ammo"><div id="gname"></div><b id="mag">0</b> <small id="res"></small><div id="slots"></div></div>
  <div id="msg"></div>
</div>

<div class="screen" id="menu"><div class="box">
  <img src="../../assets/logo.svg" alt="HKugz Games logo" style="display:block;margin:0 auto 6px;width:clamp(48px,11vh,88px);height:clamp(48px,11vh,88px);filter:drop-shadow(0 3px 10px rgba(0,0,0,.45))">
  <h1>LAST<br>STAND</h1>
  <p class="sub">Zombies keep coming in waves. Hold out as long as you can, earn money, and buy the same guns as Core Strike.</p>
  <div class="grp"><b>MAP</b><select id="mapSel"></select></div>
  <div class="grp"><b>DIFFICULTY</b><button class="alt" data-d="easy">Easy</button> <button class="alt on" data-d="normal">Normal</button> <button class="alt" data-d="hard">Hard</button></div>
  <div class="grp"><button class="big" id="play">PLAY</button></div>
  <div class="keys">
    <span><b>W A S D</b> move</span><span><b>Mouse</b> aim</span>
    <span><b>Click</b> shoot</span><span><b>Right click</b> aim / scope</span>
    <span><b>R</b> reload</span><span><b>Space</b> jump</span>
    <span><b>1 / 2</b> main / pistol</span><span><b>Esc</b> pause</span>
  </div>
  <p class="best" id="best"></p>
</div></div>

<div class="screen hide" id="shop"><div class="box">
  <h1 style="font-size:clamp(34px,7vw,64px)" id="shopT">WAVE CLEARED</h1>
  <div id="shopTop"><span id="shopMoney">$0</span><span id="shopInfo"></span><button class="big" id="next">START NEXT WAVE</button></div>
  <div id="items"></div>
</div></div>

<div class="screen hide" id="pause"><div class="box"><h1 style="font-size:52px">PAUSED</h1><div class="grp"><button class="big" id="resume">RESUME</button></div><div class="grp"><button class="alt" id="quit">Quit to menu</button></div></div></div>

<div class="screen hide" id="dead"><div class="box"><h1 style="font-size:clamp(40px,8vw,70px)">GAME OVER</h1><p class="sub" id="deadT"></p><div class="grp"><button class="big" id="again">PLAY AGAIN</button></div><div class="grp"><button class="alt" id="toMenu">Menu</button></div></div></div>

<script type="module" src="game.js?v=9"></script>
</body>
</html>
