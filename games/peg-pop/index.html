<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }

  .bar { flex: none; padding: 7px 12px; gap: 10px; }

  .bar button:hover { background: #3b2f4d; }

  .stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 6px; }

  #c { width: 100%; height: 100%; display: block; border-radius: 12px; touch-action: none; cursor: crosshair; outline: none; box-shadow: 0 10px 40px rgba(0,0,0,.6); background: #4aa7ff; }

  .ov.hide { display: none; }
  .ov h1 { margin: 0; font-size: calc(var(--u) * 58); letter-spacing: .02em; color: #ffd34e; text-shadow: 0 calc(var(--u) * 4) 0 #b2561a, 0 calc(var(--u) * 8) calc(var(--u) * 14) rgba(0,0,0,.4); }

  .ov p { margin: calc(var(--u) * 6) 0; max-width: calc(var(--u) * 560); opacity: .92; }
  .lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--u) * 10); margin: calc(var(--u) * 12) 0 calc(var(--u) * 8); width: calc(var(--u) * 700); max-width: 100%; }

  .lv button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 calc(var(--u) * 1) 0 #8aa4d8; }
  .lv button:disabled { background: #6c7aa8; color: #cfd6ee; box-shadow: none; cursor: default; }
  .lv b { display: block; font-size: calc(var(--u) * 30); line-height: 1.1; }
  .lv span { display: block; font-size: calc(var(--u) * 12.5); font-weight: 700; }
  .lv i { display: block; font-style: normal; font-size: calc(var(--u) * 17); letter-spacing: .1em; color: #ff9d1e; height: calc(var(--u) * 20); }
  .lv button:disabled i { color: #aab3d4; }
  .btns { display: flex; gap: calc(var(--u) * 10); flex-wrap: wrap; justify-content: center; margin-top: calc(var(--u) * 10); }
  .big { font: inherit; font-weight: 800; font-size: calc(var(--u) * 20); color: #4a0f2e; background: #ffa8d4; border: 0; border-radius: calc(var(--u) * 14); padding: calc(var(--u) * 10) calc(var(--u) * 24); cursor: pointer; box-shadow: 0 calc(var(--u) * 4) 0 #d4659d; }

  .big:hover { filter: brightness(1.06); } .big:active { transform: translateY(2px); box-shadow: 0 calc(var(--u) * 1) 0 #d4659d; }
  .stars { font-size: calc(var(--u) * 54); letter-spacing: .08em; color: #ffd34e; text-shadow: 0 calc(var(--u) * 3) 0 #b2561a; margin: calc(var(--u) * 2) 0; }
